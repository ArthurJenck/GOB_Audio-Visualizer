<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/style.css" />
        <title>audio-visualizer</title>
    </head>
    <body>
        <h1>Stupid dumb audio visualizer</h1>
        <div class="buttons">
            <div class="audio-input__container">
                <label for="audio-input" class="sketchy audio-input__label">
                    Upload sound
                </label>
                <input type="file" accept="audio/*" id="audio-input" />
            </div>
            <button id="play-default-btn" class="sketchy">
                Play default music
            </button>
        </div>
        <canvas id="canvas" />
        <audio src="/sound.mp3" loop />
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
